[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aviation-disruption-intelligence"
version = "0.4.1"
description = "Explainable aviation disruption-risk intelligence for operational analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
]
data = [
  "duckdb>=1.1,<2",
]
weather = [
  "httpx>=0.27,<1",
]
eurocontrol = [
  "httpx>=0.27,<1",
]

[project.scripts]
aviation-risk = "aviation_disruption.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/ozenbozkurt/aviation-disruption-intelligence"
Issues = "https://github.com/ozenbozkurt/aviation-disruption-intelligence/issues"
