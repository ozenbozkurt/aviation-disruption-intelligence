[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aviation-disruption-intelligence"
version = "0.1.0"
description = "Explainable aviation disruption-risk intelligence for operational analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
aviation-risk = "aviation_disruption.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
