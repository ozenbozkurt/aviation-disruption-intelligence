name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[api,data,weather,eurocontrol]" build
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: aviation-risk --wind-kts 30 --visibility-km 4 --precip-mm-h 3 --delay-rate 0.25 --cancel-rate 0.02
